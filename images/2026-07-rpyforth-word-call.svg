  <title
     id="title">How the metastack changes at a Forth word call</title>
  <desc
     id="desc">Before a word call, values a, b, and c are in the frame under
  scalar values d and e. On entry, d and e remain in the scalar fields while the
  frame values move to the shared spill array. The logical stack order does not
  change and return requires no copy back.</desc>
