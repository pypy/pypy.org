  <title
     id="title">Fragmented stack layout</title>
  <desc
     id="desc">The top two stack cells are scalar fields, the next eight cells
  are a small frame, and deeper values are stored in one shared spill array with
  N cells. N is 16,384 in RPyForth. The scalar fields and frame form the active
  cache, whose loads and stores can be optimized away by the tracing JIT
  compiler.</desc>
